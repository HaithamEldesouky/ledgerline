apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledgerline
  namespace: ledgerline
  labels:
    app.kubernetes.io/name: ledgerline
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: ledgerline.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledgerline
                port:
                  name: http
