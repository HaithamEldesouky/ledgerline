apiVersion: v1
kind: Secret
metadata:
  name: ledgerline-secret
  namespace: ledgerline
  labels:
    app.kubernetes.io/name: ledgerline
type: Opaque
stringData:
  DATABASE_URL: "postgres://ledgerline:CHANGE_ME@postgres:5432/ledgerline?sslmode=require"
